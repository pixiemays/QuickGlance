name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to Modrinth & CurseForge'
        required: true
        type: boolean
        default: false

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Set up Java 21 & 17 toolchains
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: |
            21
            17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run automated tests
        run: ./gradlew test --stacktrace

      - name: Build and collect all mod JARs
        run: ./gradlew buildAndCollect --stacktrace

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: quickglance-jars
          path: build/libs/*.jar

  release:
    name: Publish Release (GitHub, Modrinth, CurseForge)
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish == true)
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: quickglance-jars
          path: build/libs

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to Modrinth & CurseForge (Fabric 26.3)
        uses: Kir-Antipov/mc-publish@v3.3
        if: env.MODRINTH_TOKEN != '' || env.CURSEFORGE_TOKEN != ''
        with:
          modrinth-id: quickglance
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: ${{ secrets.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: build/libs/quickglance-fabric-*-26.3.jar
          loaders: fabric,quilt
          game-versions: 26.3
          java: 25

      - name: Publish to Modrinth & CurseForge (NeoForge 26.3)
        uses: Kir-Antipov/mc-publish@v3.3
        if: env.MODRINTH_TOKEN != '' || env.CURSEFORGE_TOKEN != ''
        with:
          modrinth-id: quickglance
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: ${{ secrets.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: build/libs/quickglance-neoforge-*-26.3.jar
          loaders: neoforge
          game-versions: 26.3
          java: 25

      - name: Publish to Modrinth & CurseForge (Fabric 1.21.1)
        uses: Kir-Antipov/mc-publish@v3.3
        if: env.MODRINTH_TOKEN != '' || env.CURSEFORGE_TOKEN != ''
        with:
          modrinth-id: quickglance
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: ${{ secrets.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: build/libs/quickglance-fabric-*-1.21.1.jar
          loaders: fabric,quilt
          game-versions: 1.21,1.21.1
          java: 21

      - name: Publish to Modrinth & CurseForge (NeoForge 1.21.1)
        uses: Kir-Antipov/mc-publish@v3.3
        if: env.MODRINTH_TOKEN != '' || env.CURSEFORGE_TOKEN != ''
        with:
          modrinth-id: quickglance
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: ${{ secrets.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: build/libs/quickglance-neoforge-*-1.21.1.jar
          loaders: neoforge
          game-versions: 1.21,1.21.1
          java: 21

      - name: Publish to Modrinth & CurseForge (Fabric 1.20.1)
        uses: Kir-Antipov/mc-publish@v3.3
        if: env.MODRINTH_TOKEN != '' || env.CURSEFORGE_TOKEN != ''
        with:
          modrinth-id: quickglance
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: ${{ secrets.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: build/libs/quickglance-fabric-*-1.20.1.jar
          loaders: fabric,quilt
          game-versions: 1.20.1
          java: 17
