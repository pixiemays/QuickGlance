name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to Modrinth & CurseForge'
        required: true
        type: boolean
        default: false

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17 & 21 toolchains
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: |
            17
            21

      - name: Set up Java 25 (Temurin - Primary)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run automated tests
        run: ./gradlew test --stacktrace

      - name: Build and collect all mod JARs
        run: ./gradlew buildAndCollect --stacktrace

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: quickglance-jars
          path: build/libs/*.jar

  release:
    name: GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish == true)
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: quickglance-jars
          path: build/libs

      - name: Extract Changelog
        run: |
          node -e "
            const fs = require('fs');
            const full = fs.readFileSync('CHANGELOG.md', 'utf-8');
            const start = full.indexOf('## [1.1.0]');
            const end = start !== -1 ? full.indexOf('---', start) : -1;
            const log = start !== -1 && end !== -1 ? full.slice(start, end).trim() : full.trim();
            fs.writeFileSync('RELEASE_CHANGELOG.md', log);
          "

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
          body_path: RELEASE_CHANGELOG.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-modrinth:
    name: Publish to Modrinth
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish == true)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: quickglance-jars
          path: build/libs

      - name: Publish all JARs to Modrinth
        run: node .github/scripts/publish.mjs --platform=modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}

  publish-curseforge:
    name: Publish to CurseForge
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish == true)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: quickglance-jars
          path: build/libs

      - name: Publish all JARs to CurseForge
        run: node .github/scripts/publish.mjs --platform=curseforge
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CURSEFORGE_PROJECT_ID: ${{ secrets.CURSEFORGE_PROJECT_ID }}

